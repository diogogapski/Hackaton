name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./prisma/ci.db
      AUTH_SECRET: ci-secret-nao-usar-em-producao
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes unitários
        run: npm test

      - name: Migrations (SQLite)
        run: npx prisma migrate deploy

      - name: Build (inclui checagem do schema PostgreSQL)
        run: npm run build

      - name: Teste de fluxo ponta a ponta (banco vazio)
        env:
          ADMIN_EMAIL: admin@ci.dev
          ADMIN_SENHA: Admin@2026!
        run: |
          npm run admin:create
          npm start > servidor.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
          npm run test:fluxo
